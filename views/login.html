<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Almoxarifado</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1f3a 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            min-height: 100vh;
        }

        .box {
            background: rgba(30, 41, 82, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 360px;
            border: 1px solid rgba(100, 150, 200, 0.2);
        }

        .logo {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .logo img {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(100, 150, 200, 0.3);
        }

        h2 {
            margin: 0 0 8px 0;
            color: #e0e6ed;
            font-size: 24px;
            text-align: center;
        }

        p {
            color: #cbd5e1;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
            line-height: 1.5;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid rgba(100, 150, 200, 0.3);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            background: rgba(30, 41, 82, 0.5);
            color: #e0e6ed;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
        }

        input::placeholder {
            color: #94a3b8;
        }

        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .erro {
            color: #fca5a5;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
            font-weight: 600;
            padding: 10px 12px;
            background: rgba(239, 68, 68, 0.1);
            border-left: 3px solid #fca5a5;
            border-radius: 6px;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(100, 150, 200, 0.2);
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
        }

        .loading {
            display: none;
            text-align: center;
            color: #60a5fa;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(96, 165, 250, 0.3);
            border-radius: 50%;
            border-top-color: #60a5fa;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">
            <img src="/favicon.png" alt="Logo Almoxarifado">
        </div>
        <h2>Almoxarifado</h2>
        <p>Insira suas credenciais autorizadas pela gerência para prosseguir.</p>
        <div id="erro" class="erro"></div>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Usuário" required autocomplete="username">
            <input type="password" id="senha" placeholder="Senha" required autocomplete="current-password">
            <button type="submit">
                <span id="btnText">Acessar Painel</span>
                <span id="loading" class="loading"><span class="spinner"></span>Conectando...</span>
            </button>
        </form>
        <div class="footer">
            💡 Utilize as credenciais fornecidas pela administração
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const erroDiv = document.getElementById('erro');
            const btnText = document.getElementById('btnText');
            const loading = document.getElementById('loading');
            const button = e.target.querySelector('button');

            erroDiv.style.display = 'none';

            const username = document.getElementById('username').value.trim();
            const senha = document.getElementById('senha').value.trim();

            if (!username || !senha) {
                erroDiv.textContent = '⚠️ Preencha todos os campos';
                erroDiv.style.display = 'block';
                return;
            }

            button.disabled = true;
            btnText.style.display = 'none';
            loading.style.display = 'block';

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, senha })
                });

                const data = await res.json();

                if (data.sucesso) {
                    window.location.href = '/';
                } else {
                    erroDiv.textContent = '❌ ' + data.erro;
                    erroDiv.style.display = 'block';
                    button.disabled = false;
                    btnText.style.display = 'inline';
                    loading.style.display = 'none';
                }
            } catch (error) {
                erroDiv.textContent = '❌ Erro ao conectar ao servidor';
                erroDiv.style.display = 'block';
                button.disabled = false;
                btnText.style.display = 'inline';
                loading.style.display = 'none';
            }
        });

        // Focus no primeiro input
        document.getElementById('username').focus();
    </script>
</body>
</html>
